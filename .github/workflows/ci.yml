name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (downloads the embedding model and builds the index)
        run: docker build -t ai-act-assistant .
      - name: Start the container and query it
        run: |
          docker run -d --name assistant -p 8000:8000 ai-act-assistant
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break || sleep 2; done
          curl -sf http://localhost:8000/health | grep '"sources":306'
          curl -sf -X POST http://localhost:8000/api/search \
            -H 'Content-Type: application/json' \
            -d '{"query": "pratiques interdites", "k": 3}' | grep 'Article 5'
